name: Preparar imagen para Coolify

# Manual: publicar una imagen no debe disparar el antiguo build del VPS.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias de pruebas
        run: npm ci --no-audit --no-fund
      - name: Comprobar la aplicación antes de publicar
        run: node --test --test-concurrency=1 tests/*.test.js

      - name: Preparar nombre y versión
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar y publicar fuera del VPS
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mostrar la imagen que debe usar Coolify
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## Imagen preparada para Coolify'
            printf '\nImagen y versión: `%s`\n' "$IMAGE_TAG"
            printf '\nReferencia exacta: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
            printf '\nLa imagen está publicada. El despliegue en Coolify se realiza por separado.\n'
          } >> "$GITHUB_STEP_SUMMARY"
